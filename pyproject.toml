[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "guard-ai"
version = "0.1.0"
description = "Provider-neutral runtime guardrails and adversarial evaluations for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=48,<51",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mcp>=2.3,<3",
  "PyJWT[crypto]>=2.10,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.1,<2",
  "uvicorn[standard]>=0.32,<1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8"
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.app.policy" = ["*.json"]
"backend.app.demo" = ["*.sql"]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-ra"
