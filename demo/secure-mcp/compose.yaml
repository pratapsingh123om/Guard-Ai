services:
  guard-ai:
    build:
      context: ../..
      dockerfile: demo/secure-mcp/gateway/Dockerfile
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:9443:9443"
    environment:
      GUARD_ADMIN_TOKEN: ${GUARD_ADMIN_TOKEN:-}
      GUARD_SQLITE_ROOT: /run/guard-ai/demo-data
    volumes:
      - ./runtime/certs:/run/guard-ai/certs:ro
      - ./runtime/tokens:/run/guard-ai/tokens:ro
      - ../integration-data:/run/guard-ai/demo-data:ro
    networks:
      guard-ai-demo:
        aliases:
          - guard-ai.demo
    read_only: true
    tmpfs:
      - /run/guard-ai:size=16m,mode=0770
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/guard-ai/backend.sock && test -s /tmp/nginx.pid && kill -0 $$(cat /tmp/nginx.pid)"]
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 90s

  coordinator:
    profiles: ["client"]
    build:
      context: ../..
      dockerfile: demo/secure-mcp/coordinator/Dockerfile
    depends_on:
      guard-ai:
        condition: service_healthy
    environment:
      GUARD_MCP_BENCHMARK_ITERATIONS: ${GUARD_MCP_BENCHMARK_ITERATIONS:-25}
    volumes:
      - ./runtime/certs:/run/guard-ai/certs:ro
      - ./runtime/tokens:/run/guard-ai/tokens:ro
    networks:
      - guard-ai-demo
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  guard-ai-demo:
    driver: bridge
