user nginx;
worker_processes 1;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    log_format guard_security escape=json
        '{"timestamp":"$time_iso8601","remote_addr":"$remote_addr",'
        '"request_id":"$request_id","method":"$request_method","uri":"$uri",'
        '"status":$status,"latency":$request_time,"tls_version":"$ssl_protocol",'
        '"tls_cipher":"$ssl_cipher","tls_group":"$ssl_curve",'
        '"mtls":"$ssl_client_verify","client_subject":"$ssl_client_s_dn",'
        '"client_serial":"$ssl_client_serial"}';

    access_log /dev/stdout guard_security;
    server_tokens off;
    client_max_body_size 1m;

    map $ssl_client_fingerprint $agent_rate_key {
        ""      $binary_remote_addr;
        default $ssl_client_fingerprint;
    }
    limit_req_zone $agent_rate_key zone=agent_requests:10m rate=30r/s;

    upstream guard_ai_backend {
        server unix:/run/guard-ai/backend.sock;
        keepalive 16;
    }

    server {
        listen 8443 ssl;
        server_name guard-ai.demo;

        ssl_protocols TLSv1.3;
        ssl_ecdh_curve X25519MLKEM768;
        ssl_session_tickets off;
        ssl_session_cache off;
        ssl_certificate /run/guard-ai/certs/interop/server.crt;
        ssl_certificate_key /run/guard-ai/certs/interop/server.key;
        ssl_client_certificate /run/guard-ai/certs/interop/ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 2;

        location / {
            limit_req zone=agent_requests burst=20 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host guard-ai.demo;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-Proto https;

            # Always replace client-controlled copies with TLS-derived values.
            proxy_set_header X-Guard-TLS-Verified $ssl_client_verify;
            proxy_set_header X-Guard-TLS-Version $ssl_protocol;
            proxy_set_header X-Guard-TLS-Group $ssl_curve;
            proxy_set_header X-Guard-Client-Cert $ssl_client_escaped_cert;
            proxy_set_header X-Guard-Client-Subject $ssl_client_s_dn;
            proxy_set_header X-Guard-Client-Serial $ssl_client_serial;

            proxy_read_timeout 65s;
            proxy_send_timeout 65s;
            proxy_pass http://guard_ai_backend;
        }
    }

    # Controlled-client profile: hybrid KEX plus ML-DSA-65 certificates.
    server {
        listen 9443 ssl;
        server_name guard-ai.demo;

        ssl_protocols TLSv1.3;
        ssl_ecdh_curve X25519MLKEM768;
        ssl_session_tickets off;
        ssl_session_cache off;
        ssl_certificate /run/guard-ai/certs/strict/server.crt;
        ssl_certificate_key /run/guard-ai/certs/strict/server.key;
        ssl_client_certificate /run/guard-ai/certs/strict/ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 2;

        location / {
            limit_req zone=agent_requests burst=20 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host guard-ai.demo;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Guard-TLS-Verified $ssl_client_verify;
            proxy_set_header X-Guard-TLS-Version $ssl_protocol;
            proxy_set_header X-Guard-TLS-Group $ssl_curve;
            proxy_set_header X-Guard-Client-Cert $ssl_client_escaped_cert;
            proxy_set_header X-Guard-Client-Subject $ssl_client_s_dn;
            proxy_set_header X-Guard-Client-Serial $ssl_client_serial;
            proxy_read_timeout 65s;
            proxy_send_timeout 65s;
            proxy_pass http://guard_ai_backend;
        }
    }
}
